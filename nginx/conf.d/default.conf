log_format token_safe '$remote_addr [$time_local] '
                      '"$request_method $uri $server_protocol" $status '
                      '$body_bytes_sent $request_time';

map_hash_bucket_size 128;

map $arg_token $is_valid_token {
    default 0;
    include /etc/nginx/tokens.map;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    access_log /var/log/nginx/access.log token_safe;

    location ~* /(?:episodes\.json|seen\.txt)$ {
        return 404;
    }

    location / {
        if ($is_valid_token = 0) {
            return 403;
        }

        root /usr/share/nginx/podcasts;
        autoindex off;

        sub_filter_types application/rss+xml application/xml text/xml;
        sub_filter_once off;
        sub_filter '__REQUEST_TOKEN__' $arg_token;
    }
}
