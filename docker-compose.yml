services:
  youtubecast:
    image: youtubecast:latest
    container_name: youtubecast
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./podcasts:/app/podcasts
      - ./crontab:/app/crontab:ro

  nginx:
    image: nginx:alpine
    container_name: youtubecast-web
    restart: unless-stopped
    # ports:
    #   - "8081:8081"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tokens.map:/etc/nginx/tokens.map:ro
      - ./podcasts:/usr/share/nginx/podcasts:ro
